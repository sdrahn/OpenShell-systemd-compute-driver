#
# The helper's state directory and the mount points the sandbox units
# bind a sandbox's files to: the paths the stock openshell-supervisor and
# openshell-sandbox use in a container. They are made here, not by the
# helper, so that the helper needs no right to create anything in / or
# /etc. /etc/openshell itself is not named: it may be another package's.

d /var/lib/openshell/systemd 0711 root root -
d /.openshell 0755 root root -
d /.openshell/supervisor 0755 root root -
d /.openshell/channel 0755 root root -
d /sandbox 0755 root root -
d /etc/openshell/auth 0755 root root -
d /etc/openshell/tls/client 0755 root root -
f /etc/openshell/auth/sandbox.jwt 0600 root root -
f /etc/openshell/tls/client/ca.crt 0600 root root -
