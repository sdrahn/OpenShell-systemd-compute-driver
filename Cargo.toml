[package]
name = "openshell-driver-systemd"
description = "A compute driver for OpenShell that runs sandboxes as systemd units on the gateway's host"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/sdrahn/OpenShell-systemd-compute-driver"
publish = false

[[bin]]
name = "openshell-driver-systemd"
path = "src/main.rs"

[[bin]]
name = "openshell-systemd-helper"
path = "src/bin/openshell-systemd-helper.rs"

[[bin]]
name = "openshell-supervisor-fence"
path = "src/bin/openshell-supervisor-fence.rs"

# OpenShell does not publish its crates. They come from the release named
# here, which is also the release of the openshell-supervisor and
# openshell-sandbox packages the package requires (packaging/suse): they
# always match.
# Change the tag in all four lines and in packaging/suse at once
# (tools/openshell-version).
[dependencies]
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.9", default-features = false, features = ["driver-extraction", "otel", "clap"] }
openshell-crypto = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.9", default-features = false, features = ["aws-lc"] }
openshell-isolation-interface = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.9" }
openshell-sandbox-backend = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.9" }

clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
# The fence the helper puts around itself (src/fence.rs). The crate
# OpenShell uses for openshell-sandbox, at the version it is locked to.
landlock = "0.4"
miette = { version = "7", features = ["fancy"] }
nix = { version = "0.29", features = ["signal", "process", "user", "fs", "term"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

# OpenShell's own lint levels, so that the code reads like its drivers.
[lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
ref_option = "allow"
missing_fields_in_debug = "allow"

[profile.release]
strip = true
